<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Acceso | Control de Gastos</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/png" href="image.png">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<style>
		:root {
			--bg: #F8FAFC;
			--surface: #FFFFFF;
			--text: #1E293B;
			--muted: #64748B;
			--line: #E2E8F0;
			--primary: #2563EB;
			--primary-soft: #DBEAFE;
			--shadow: 0 4px 20px rgba(0,0,0,0.05);
			--radius: 8px;
			--sans: "IBM Plex Sans", "Segoe UI", sans-serif;
			--mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background: linear-gradient(135deg, #FFFFFF 0%, var(--bg) 48%, #EEF6FF 100%);
			color: var(--text);
			font-family: var(--sans);
			font-variant-numeric: tabular-nums;
		}

		button,
		input {
			font: inherit;
		}

		.login-shell {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 420px;
			align-items: center;
			width: min(1080px, calc(100% - 32px));
			min-height: 100vh;
			margin: 0 auto;
			gap: 42px;
			padding: 42px 0;
		}

		.brand-panel {
			display: grid;
			gap: 22px;
		}

		.eyebrow {
			margin: 0;
			color: var(--muted);
			font-size: 0.82rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			max-width: 650px;
			font-size: clamp(2rem, 5vw, 4.2rem);
			line-height: 1;
			letter-spacing: 0;
		}

		.brand-copy {
			max-width: 560px;
			margin: 0;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.65;
		}

		.metrics-strip {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 10px;
			max-width: 620px;
		}

		.metric {
			border: 1px solid var(--line);
			border-radius: var(--radius);
			background: rgba(255,255,255,0.76);
			box-shadow: var(--shadow);
			padding: 14px;
		}

		.metric strong {
			display: block;
			font-family: var(--mono);
			font-size: 1.05rem;
		}

		.metric span {
			color: var(--muted);
			font-size: 0.82rem;
			font-weight: 700;
		}

		.login-card {
			border: 1px solid var(--line);
			border-radius: var(--radius);
			background: var(--surface);
			box-shadow: var(--shadow);
			padding: 26px;
		}

		.login-card h2 {
			margin: 0 0 8px;
			font-size: 1.35rem;
		}

		.login-card p {
			margin: 0 0 22px;
			color: var(--muted);
			line-height: 1.5;
		}

		.field {
			display: grid;
			gap: 8px;
			margin-bottom: 14px;
		}

		.field label {
			color: #334155;
			font-size: 0.86rem;
			font-weight: 700;
		}

		.field input {
			width: 100%;
			min-height: 46px;
			border: 1px solid #CBD5E1;
			border-radius: var(--radius);
			background: #FFFFFF;
			color: var(--text);
			padding: 11px 12px;
			outline: none;
			transition: border-color 160ms ease, box-shadow 160ms ease;
		}

		.field input:focus {
			border-color: var(--primary);
			box-shadow: 0 0 0 3px rgba(37,99,235,0.13);
		}

		.primary-button {
			width: 100%;
			min-height: 46px;
			border: 0;
			border-radius: var(--radius);
			background: var(--primary);
			color: #FFFFFF;
			box-shadow: 0 8px 18px rgba(37,99,235,0.22);
			cursor: pointer;
			font-weight: 800;
		}

		.primary-button:disabled {
			cursor: wait;
			opacity: 0.7;
		}

		.login-footnote {
			margin-top: 16px;
			color: var(--muted);
			font-size: 0.85rem;
			text-align: center;
		}

		.swal2-popup {
			font-family: var(--sans);
		}

		@media (max-width: 860px) {
			.login-shell {
				grid-template-columns: 1fr;
				align-content: center;
				gap: 26px;
			}

			.metrics-strip {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main class="login-shell">
		<section class="brand-panel" aria-labelledby="loginTitle">
			<p class="eyebrow">Facturaciones</p>
			<h1 id="loginTitle">Sistema de Control de gastos </h1>
			<div class="metrics-strip" aria-label="Resumen de capacidades">
				<div class="metric"><strong>Auth</strong><span>Usuarios</span></div>
				<div class="metric"><strong>BCV</strong><span>Conversión automática</span></div>
				<div class="metric"><strong>XLSX</strong><span>Reporte gerencial</span></div>
			</div>
		</section>

		<section class="login-card" aria-label="Inicio de sesión">
			<h2>Ingresar</h2>
			<p>Usa el correo y contraseña creados en Supabase Auth para entrar al módulo.</p>
			<form id="loginForm">
				<div class="field">
					<label for="email">Correo</label>
					<input id="email" name="email" type="email" autocomplete="email" required placeholder="usuario@empresa.com">
				</div>
				<div class="field">
					<label for="password">Contraseña</label>
					<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
				</div>
				<button class="primary-button" id="loginButton" type="submit">Ingresar al sistema</button>
			</form>
		</section>
	</main>

	<script src="supabase-config.js"></script>
	<script>
		const loginForm = document.querySelector("#loginForm");
		const loginButton = document.querySelector("#loginButton");

		document.addEventListener("DOMContentLoaded", async () => {
			const { data } = await supabaseClient.auth.getSession();
			if (data.session) {
				window.location.href = "gastos.html";
			}
		});

		loginForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			loginButton.disabled = true;
			loginButton.textContent = "Validando...";

			const email = loginForm.email.value.trim();
			const password = loginForm.password.value;

			const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

			if (error) {
				loginButton.disabled = false;
				loginButton.textContent = "Entrar al sistema";
				await Swal.fire({ icon: "error", title: "Acceso rechazado", text: error.message });
				return;
			}

			window.location.href = "gastos.html";
		});
	</script>
</body>
</html>
